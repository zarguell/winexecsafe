# WinExecSafe Configuration File
# This file controls the behavior of the AppContainer process jail wrapper

[General]
# Full path to the executable to run in the sandbox
# Required if not specified via command line
Executable=C:\Windows\System32\cmd.exe

# Command-line arguments to pass to the target executable
# Optional
Arguments=/c echo Hello from jail!

# Directory where the sandboxed process can read/write files
# Required if not specified via command line
# This directory will be created if it doesn't exist
JailDirectory=C:\WinExecSafeJail

# Working directory inside the jail (default: jail root)
# Optional
WorkingDirectory=C:\WinExecSafeJail\work

# Unique name for the AppContainer profile
# Optional - if not specified, will auto-generate from timestamp
ContainerName=MyAppContainer

# Allow network access (default: false)
# Set to true to grant internet client/server capabilities
AllowNetwork=false

# Delete AppContainer profile after process exits (default: true)
# Set to false to keep the profile for debugging
Cleanup=true

[Permissions]
# Additional read-only directories (semicolon-separated)
# The process will have read/execute access to these directories
# Optional - additional to System32 and SysWOW64
AdditionalReadPaths=C:\Program Files\MyApp;C:\SharedData

[Logging]
# Enable detailed logging (default: false)
# Set to true to see detailed progress information
Verbose=true

# Path to log file (optional)
# If specified, logs will be written to this file with timestamps
LogFile=C:\ProgramData\winexecsafe\logs\wrapper.log
